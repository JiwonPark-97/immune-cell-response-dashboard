services:
  - type: web
    name: immune-cell-response-dashboard
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      npm --prefix frontend ci &&
      npm --prefix frontend run build
    startCommand: >-
      python load_data.py &&
      python -m uvicorn api:app --host 0.0.0.0 --port $PORT
